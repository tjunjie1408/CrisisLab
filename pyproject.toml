[project]
name = "crisislab"
version = "0.1.0"
description = "Historical US Bank Failure Early Warning System — Data-Centric ML Engineering Project"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28.0",
    "joblib>=1.4",
    "lightgbm>=4.5.0",
    "mlflow>=3.18.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pandera>=0.22.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "scikit-learn>=1.6.0",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
crisislab-register = "crisislab.models.registry:main"
crisislab-score = "crisislab.pipeline.batch_score:main"
crisislab-experiments = "crisislab.pipeline.experiments:main"
crisislab-audit = "crisislab.spike.feasibility:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crisislab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


