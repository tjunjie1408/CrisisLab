name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python 3.12 & dependencies
        run: uv sync --locked
      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: PIT & Data Contract Tests
        run: uv run pytest -v

  docker-packaging:
    runs-on: ubuntu-latest
    needs: contracts-and-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t crisislab:ci .
      - name: Smoke-test CLI entry points
        run: |
          docker run --rm crisislab:ci crisislab-score --help
          docker run --rm crisislab:ci crisislab-register --help
